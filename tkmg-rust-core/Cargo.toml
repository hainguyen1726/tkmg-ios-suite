[package]
name = "tkmg_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "tkmg_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
